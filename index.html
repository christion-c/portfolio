<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Runs before first paint so a saved theme choice applies immediately (no flash of the wrong theme) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Christion Callahan — Back-End & Platform Engineer portfolio showcasing projects, experience, and skills." />
    <link rel="canonical" href="https://christioncallahan.com/" />
    <title>Christion Callahan — Portfolio</title>

    <!-- Open Graph (Facebook, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://christioncallahan.com/" />
    <meta property="og:title" content="Christion Callahan — Back-End & Platform Engineer" />
    <meta
      property="og:description"
      content="Portfolio showcasing projects, experience, and skills — I build the parts of an application you only notice when they break."
    />
    <meta property="og:image" content="https://christioncallahan.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Christion Callahan — Back-End & Platform Engineer" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Christion Callahan — Back-End & Platform Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio showcasing projects, experience, and skills — I build the parts of an application you only notice when they break."
    />
    <meta name="twitter:image" content="https://christioncallahan.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static, hidden duplicate of the React contact form (src/components/ui/ContactForm.tsx).
      Netlify's form-detection bot scans the BUILT HTML at deploy time, not JS-rendered markup,
      so this is how it discovers the "contact" form and its fields. Field names must stay in
      sync with the real form. It's never shown or interacted with by visitors.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
